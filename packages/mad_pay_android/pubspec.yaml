name: mad_pay_android
description: A plug-in to add support for payments on the Android side of Mad Pay
version: 2.2.14
repository: https://github.com/MadBrains/Mad-Pay-Flutter
issue_tracker: https://github.com/MadBrains/Mad-Pay-Flutter/issues
homepage: https://madbrains.ru/
publish_to: none

environment:
  sdk: "^3.6.0"
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  mad_pay_platform_interface:
    git:
      url: https://github.com/GEBIT/Mad-Pay-Flutter
      path: packages/mad_pay_platform_interface
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/en/
    - assets/ar/
    - assets/bg/
    - assets/ca/
    - assets/cs/
    - assets/da/
    - assets/de/
    - assets/el/
    - assets/es/
    - assets/et/
    - assets/fi/
    - assets/fr/
    - assets/hr/
    - assets/id/
    - assets/it/
    - assets/ja/
    - assets/ko/
    - assets/ms/
    - assets/nl/
    - assets/no/
    - assets/pl/
    - assets/pt/
    - assets/ru/
    - assets/sk/
    - assets/sl/
    - assets/sr/
    - assets/sv/
    - assets/th/
    - assets/tr/
    - assets/uk/
    - assets/zh/

  plugin:
    platforms:
      android:
        package: ru.madbrains.mad_pay_android
        pluginClass: MadPayAndroidPlugin
