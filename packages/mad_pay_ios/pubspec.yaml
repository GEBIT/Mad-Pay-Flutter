name: mad_pay_ios
description: A plug-in to add support for payments on the iOS side of Mad Pay
version: 2.2.14
repository: https://github.com/MadBrains/Mad-Pay-Flutter
issue_tracker: https://github.com/MadBrains/Mad-Pay-Flutter/issues
homepage: https://madbrains.ru/

environment:
  sdk: "^3.6.0"
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  mad_pay_platform_interface:
    git:
      url: https://github.com/TomKrauss/Mad-Pay-Flutter
      path: packages/mad_pay_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: MadPayIosPlugin
